<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jarvis · write</title>
<style>
  /* 启动闪屏:桌面壳在拉起后端期间先显示本页(纯静态、零依赖、零网络),
     后端就绪后壳会把窗口导航到本地服务页面。内容要说清两件事:
     正在启动、首启慢是杀毒扫描不是卡死——治「打开没反应,用户连点」。 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #14161a; color: #e6e8eb;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  .wrap { text-align: center; padding: 32px; }
  .logo {
    font-size: 28px; font-weight: 600; letter-spacing: 0.5px;
    margin-bottom: 28px;
  }
  .logo .accent { color: #7c9cff; }
  .spinner {
    width: 34px; height: 34px; margin: 0 auto 22px;
    border: 3px solid rgba(124, 156, 255, 0.22);
    border-top-color: #7c9cff;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status { font-size: 15px; color: #c9ced6; margin-bottom: 10px; }
  .hint { font-size: 12.5px; color: #7d838d; line-height: 1.7; max-width: 420px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">jarvis <span class="accent">·</span> write</div>
    <div class="spinner"></div>
    <div class="status">正在启动本地服务…</div>
    <div class="hint">首次启动或更新后启动可能需要十几秒到一分钟(杀毒软件正在扫描程序文件)，属正常现象，请勿反复点击打开。</div>
  </div>
</body>
</html>
