# A generic, single database configuration.

[alembic]
# path to migration scripts
# %(here)s = the directory containing this ini. A bare relative path is
# resolved against the CURRENT WORKING DIRECTORY, which is NOT the PyInstaller
# _MEIPASS dir in the frozen desktop app - the migration scripts would not be
# found and startup would silently fall back to create_all.
script_location = %(here)s/alembic

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .

# path separator for prepend_sys_path; use os-specific separator
path_separator = os

# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, requires the python>=3.9 or backports.zoneinfo library.
# Any required deps can installed by adding `alembic[tz]` to the pip requirements
# timezone =

# string output used to represent the time. Default is ISO format.
# date_format = %%%Y-%%m-%%d_%%H:%%M:%%S

# version number format; normally incremental.  Can be set to
# ``hex`` for a hex identifier.
# version_path_separator = os
# use the logging configuration specified in this file.  Logging can
# also be configured programmatically within the env.py module.
# log_level = INFO

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
