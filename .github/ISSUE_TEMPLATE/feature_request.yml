name: 功能请求
description: 提议一个新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的功能建议！请描述清楚你想要什么、为什么需要，以及可能的实现思路。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题是什么？
      description: 描述这个功能要解决的痛点或场景
      placeholder: 例如：写长篇小说时，我经常需要在不同章节之间跳转查看前文，但当前阅读器没有书签功能
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你期望的解决方案是什么？
      description: 清晰描述你想要的功能和交互方式
      placeholder: 例如：在阅读器侧边栏加一个书签列表，点击段落旁边的书签图标可以添加/移除书签
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案？
      description: 有没有其他方式可以解决同样的问题？

  - type: dropdown
    id: area
    attributes:
      label: 涉及的功能模块
      multiple: true
      options:
        - 小说生成流水线（开书/大纲/正文）
        - 长程一致性（故事圣经/伏笔）
        - 大纲级联更新
        - 润色 / 去 AI 味
        - 漫剧工坊
        - 宣传片工坊
        - 情绪短片工坊
        - 生日祝福工坊
        - 桌面版
        - 部署 / 运维
        - 其他
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 任何其他相关信息、截图、参考链接等
