# 安卓 App 构建:Capacitor 壳(远程客户端——壳内是前端产物,运行时连用户自己的
# jarvis-write 服务,登录页填服务器地址)。触发:推 v* 标签(与桌面版同 tag 同 Release)
# 或手动。无 keystore secrets 时产出 debug 签名 APK(可直接安装);后续要上正式
# 签名/应用商店,再补 keystore secrets 与 assembleRelease。
name: Android APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: frontend

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22   # Capacitor CLI 要求 >=22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 安装前端依赖
        run: npm ci --no-fund --no-audit

      - name: 构建前端(壳内产物,相对路径)
        run: npm run build:app

      - name: 同步到安卓工程
        run: npx cap sync android

      - name: 构建 Debug APK(可直接安装)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 重命名产物
        run: |
          mkdir -p ../apk-out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             ../apk-out/jarvis-write_${{ github.ref_name }}_android-debug.apk

      - name: 上传构建产物( always,供手动下载体验)
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-write-android-apk
          path: apk-out/*.apk
          if-no-files-found: error

      - name: 追加到同名 Release(仅标签触发;等桌面工作流先建 Release,最多等 20 分钟)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd ..
          tag="${{ github.ref_name }}"
          for i in $(seq 1 40); do
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release 已存在(第 $i 次检查)"
              gh release upload "$tag" apk-out/*.apk --clobber
              exit 0
            fi
            echo "Release 尚未创建(桌面版仍在构建),30 秒后重试…"
            sleep 30
          done
          echo "等待超时,兜底自建 Release 挂 APK(桌面版随后会并入同一 Release)"
          gh release create "$tag" apk-out/*.apk --title "jarvis-write $tag" --notes "Android APK(桌面版说明见 CHANGELOG)" --clobber
